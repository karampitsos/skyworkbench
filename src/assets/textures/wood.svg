<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0007 0.028" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feGaussianBlur stdDeviation="0 1.5"/>
    <feColorMatrix values="0 0 0 0 0.86  0 0 0 0 0.69  0 0 0 0 0.49  0.9 0 0 0 -0.32"/>
  </filter>
  <filter id="fine" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.002 0.09" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feGaussianBlur stdDeviation="0 0.8"/>
    <feColorMatrix values="0 0 0 0 0.52  0 0 0 0 0.34  0 0 0 0 0.19  0.8 0 0 0 -0.45"/>
  </filter>
  <rect width="100%" height="100%" fill="#b98a5c"/>
  <rect width="100%" height="100%" filter="url(#grain)"/>
  <rect width="100%" height="100%" filter="url(#fine)"/>
</svg>
